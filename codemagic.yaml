workflows:
  android-build:
    name: Build KYC Bypasser APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Debug APK
        script: |
          # The original repo is missing gradlew, so we use the system gradle
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - franklinkimurgor@gmail.com
        notify:
          success: true
          failure: true